// Katana's build: Java 21, offline, every dependency a file under third_party/ (R-001).
// No repository is declared, so nothing can reach the network; a new dependency is vendored first.
plugins {
    id 'java'
}

// The image pins Gradle (Dockerfile); a different Gradle outside it is refused, not tolerated.
if (gradle.gradleVersion != '8.14.3') {
    throw new GradleException("Katana builds with Gradle 8.14.3 (the Dockerfile's image); this is ${gradle.gradleVersion}")
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Katana's modules are the folders docs/modules.json names (the list lives only there); the study's
// prototypes inside them are not part of the build.
def modules = new groovy.json.JsonSlurper().parse(file('docs/modules.json')).modules.keySet()

// front/'s parser, generated from the forked ProLeap grammars (front/grammar/, MIT) by the vendored
// ANTLR tool into build/, never committed (phase 2.1).
def grammarOut = layout.buildDirectory.dir('generated/grammar')

sourceSets {
    main {
        java {
            srcDirs = modules.collect { it } + [grammarOut]
            exclude '**/prototypes/**'
        }
    }
    // The project's own tooling (phase 0.6): the kernel map and the metrics. Never shipped.
    scripts {
        java.srcDirs = ['scripts']
    }
    // The doc tests and the scripts' tests (default package), and each module's tests (its package).
    test {
        java.srcDirs = ['test']
        compileClasspath += scripts.output
        runtimeClasspath += scripts.output
    }
}

configurations {
    antlrTool
}

dependencies {
    antlrTool files('third_party/antlr/antlr4-4.13.2-complete.jar')
    implementation files('third_party/antlr/antlr4-runtime-4.13.2.jar')
    scriptsImplementation files('third_party/gson/gson-2.11.0.jar')
    testImplementation files('third_party/gson/gson-2.11.0.jar')
    testImplementation fileTree(dir: 'third_party/junit', include: '*.jar')
}

def generateGrammar = tasks.register('generateGrammar', JavaExec) {
    description = 'Generates front/\'s lexers and parsers from front/grammar/*.g4.'
    classpath = configurations.antlrTool
    mainClass = 'org.antlr.v4.Tool'
    inputs.dir('front/grammar')
    outputs.dir(grammarOut)
    args = ['-o', grammarOut.get().dir('katana/front/grammar').asFile.path, '-Xexact-output-dir', '-package', 'katana.front.grammar',
            '-no-visitor', '-listener', file('front/grammar/CobolPreprocessor.g4').path, file('front/grammar/Cobol.g4').path]
}
tasks.named('compileJava') { dependsOn generateGrammar }

tasks.register('metrics', JavaExec) {
    description = 'Prints the metrics of docs/AGENT.md and the warnings of docs/ROADMAP.md 4.2.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'Metrics'
    systemProperty 'katana.root', rootDir.absolutePath
}

tasks.register('kernelMap', JavaExec) {
    description = 'Appends to docs/KERNEL-MAP.md a row for every function in a module it does not hold.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'KernelMap'
    systemProperty 'katana.root', rootDir.absolutePath
}

tasks.named('test') {
    // The fast loop: no cobc and no corpus. What needs them is tagged `integration`.
    useJUnitPlatform {
        excludeTags 'integration'
    }
    // The doc tests read the repository; they run from its root wherever Gradle is started.
    systemProperty 'katana.root', rootDir.absolutePath
    // The tests read the whole repository, not just their classes: never skip them as up to date.
    outputs.upToDateWhen { false }
    testLogging {
        events = ['failed', 'skipped']
        exceptionFormat = 'full'
    }
}

tasks.register('integration', Test) {
    description = 'The tests that need cobc and the fetched corpus (run in the image): NIST, later CardDemo.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    systemProperty 'katana.root', rootDir.absolutePath
    // `-Dkatana.record=true` rewrites the integration goldens from the run (their diff is the review).
    systemProperty 'katana.record', System.getProperty('katana.record', 'false')
    // `-Dkatana.std=ibm` runs one dialect of the NIST run only; by default both.
    systemProperty 'katana.std', System.getProperty('katana.std', 'cobol85,ibm')
    // Each test class in a JVM of its own, up to four at once: the suites write to folders of their own
    // under build/ (the pre-push check, tithe pass 2a).
    maxParallelForks = Math.min(4, Runtime.runtime.availableProcessors())
    forkEvery = 1
    outputs.upToDateWhen { false }
    testLogging {
        events = ['passed', 'failed', 'skipped']
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}
