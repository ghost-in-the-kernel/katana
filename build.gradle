// Katana's build: Java 21, offline, every dependency a file under third_party/ (R-001).
// No repository is declared, so nothing can reach the network; a new dependency is vendored first.
plugins {
    id 'java'
}

// The image pins Gradle (Dockerfile); a different Gradle outside it is refused, not tolerated.
if (gradle.gradleVersion != '8.14.3') {
    throw new GradleException("Katana builds with Gradle 8.14.3 (the Dockerfile's image); this is ${gradle.gradleVersion}")
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Katana's modules are the folders docs/modules.json names (the list lives only there); the study's
// prototypes inside them are not part of the build.
def modules = new groovy.json.JsonSlurper().parse(file('docs/modules.json')).modules.keySet()

// front/'s parser, generated from the forked ProLeap grammars (front/grammar/, MIT) by the vendored
// ANTLR tool and compiled into a jar under build/, never committed (phase 2.1). The jar is named by the
// grammars' and the tool's hash and built only when no jar of that hash exists: `--rerun-tasks`, the fast
// loop's measure, re-ran the generation and the parser's compile every time, 11 s of its 25 (R-054, J-185).
def antlrJar = file('third_party/antlr/antlr4-4.13.2-complete.jar')
def grammarFiles = ['CobolPreprocessor.g4', 'Cobol.g4'].collect { file("front/grammar/$it") }
def grammarHash = {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    grammarFiles.each { digest.update(it.bytes) }
    digest.update(antlrJar.name.bytes)
    digest.digest().encodeHex().toString().take(16)
}()
def grammarJarFile = layout.buildDirectory.file("grammar-cache/grammar-${grammarHash}.jar").get().asFile

sourceSets {
    main {
        java {
            srcDirs = modules.findAll { it != 'rt' }.collect { it }
            exclude '**/prototypes/**'
        }
    }
    // rt/ ships inside each customer's suite and imports nothing (MOD-02, R-002): its own source set,
    // compiled against the JDK alone, so an import of ours or of a library fails to compile.
    rt {
        java.srcDirs = ['rt']
    }
    // The project's own tooling (phase 0.6): the kernel map and the metrics. Never shipped.
    scripts {
        java.srcDirs = ['scripts']
    }
    // The doc tests and the scripts' tests (default package), and each module's tests (its package).
    test {
        java.srcDirs = ['test']
        compileClasspath += scripts.output + rt.output
        runtimeClasspath += scripts.output + rt.output
    }
}

configurations {
    antlrTool
}

dependencies {
    antlrTool files('third_party/antlr/antlr4-4.13.2-complete.jar')
    implementation files('third_party/antlr/antlr4-runtime-4.13.2.jar')
    implementation files(grammarJarFile) { builtBy 'grammarJar' }
    scriptsImplementation files('third_party/gson/gson-2.11.0.jar')
    testImplementation files('third_party/gson/gson-2.11.0.jar')
    testImplementation fileTree(dir: 'third_party/junit', include: '*.jar')
}

// Generates front/'s lexers and parsers from the grammars and compiles them into `jar`, unless it exists; it
// names no project at execution time, so it is fit for Gradle's configuration cache.
abstract class GrammarJar extends DefaultTask {
    @javax.inject.Inject abstract org.gradle.process.ExecOperations getExecOperations()
    @org.gradle.api.tasks.Internal File jar, work, runtime
    @org.gradle.api.tasks.Internal List<File> grammars
    @org.gradle.api.tasks.Internal FileCollection tool

    @org.gradle.api.tasks.TaskAction
    void build() {
        if (jar.exists()) return
        deleteTree(work.toPath())
        def sources = new File(work, 'src/katana/front/grammar'), classes = new File(work, 'classes')
        sources.mkdirs()
        classes.mkdirs()
        execOperations.javaexec {
            classpath = tool
            mainClass = 'org.antlr.v4.Tool'
            args = ['-o', sources.path, '-Xexact-output-dir', '-package', 'katana.front.grammar', '-no-visitor', '-listener'] + grammars.collect { it.path }
        }
        def files = java.nio.file.Files.walk(sources.toPath()).withCloseable { s -> s.filter { it.toString().endsWith('.java') }.collect { it.toString() }.toList() }
        def javac = javax.tools.ToolProvider.systemJavaCompiler
        if (javac.run(null, null, null, (['--release', '21', '-encoding', 'UTF-8', '-nowarn', '-classpath', runtime.path, '-d', classes.path] + files) as String[]) != 0) {
            throw new GradleException('the generated parser did not compile')
        }
        def partial = new File(work, 'grammar.jar')
        new java.util.jar.JarOutputStream(new FileOutputStream(partial)).withCloseable { out ->
            java.nio.file.Files.walk(classes.toPath()).withCloseable { s ->
                s.filter { java.nio.file.Files.isRegularFile(it) }.sorted().forEach { f ->
                    out.putNextEntry(new java.util.jar.JarEntry(classes.toPath().relativize(f).toString().replace(File.separatorChar, '/' as char)))
                    out.write(java.nio.file.Files.readAllBytes(f))
                    out.closeEntry()
                }
            }
        }
        jar.parentFile.mkdirs()
        jar.parentFile.listFiles().findAll { it.name.startsWith('grammar-') && it.name.endsWith('.jar') }.each { it.delete() }
        java.nio.file.Files.move(partial.toPath(), jar.toPath(), java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        deleteTree(work.toPath())
    }

    private static void deleteTree(java.nio.file.Path root) {
        if (!java.nio.file.Files.exists(root)) return
        java.nio.file.Files.walk(root).withCloseable { s -> s.sorted(Comparator.reverseOrder()).forEach { java.nio.file.Files.delete(it) } }
    }
}
tasks.register('grammarJar', GrammarJar) {
    description = 'Generates front/\'s lexers and parsers from front/grammar/*.g4 and compiles them into a jar named by their hash, unless it exists.'
    jar = grammarJarFile
    work = layout.buildDirectory.dir('grammar-cache/work').get().asFile
    runtime = file('third_party/antlr/antlr4-runtime-4.13.2.jar')
    grammars = grammarFiles
    tool = configurations.antlrTool
}
tasks.named('compileJava') { dependsOn 'grammarJar' }

tasks.register('metrics', JavaExec) {
    description = 'Prints the metrics of docs/AGENT.md and the warnings of docs/ROADMAP.md 4.2.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'Metrics'
    systemProperty 'katana.root', rootDir.absolutePath
}

// 8A.1 (R-072): a foreign Java port held to its COBOL through the lanes, until 8.1's CLI names it `katana prove`:
// gradle prove --args="<fixture> <PGM>=<command...>".
tasks.register('prove', JavaExec) {
    description = 'Runs a foreign Java port of a fixture\'s program through the lanes and reports each dataset SAME or DIFFER.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'katana.oracle.prove.Prove'
}

// J-232: the next free R, J and research section, against the tree and origin/main (fetch first).
tasks.register('nextId', JavaExec) {
    description = 'Prints the next free decision, journal entry and research section.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'NextId'
    systemProperty 'katana.root', rootDir.absolutePath
}

tasks.register('kernelMap', JavaExec) {
    description = 'Appends to docs/KERNEL-MAP.md a row for every function in a module it does not hold.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'KernelMap'
    systemProperty 'katana.root', rootDir.absolutePath
}

tasks.named('test') {
    // The fast loop: no cobc and no corpus. What needs them is tagged `integration`.
    useJUnitPlatform {
        excludeTags 'integration'
    }
    // The doc tests read the repository; they run from its root wherever Gradle is started.
    systemProperty 'katana.root', rootDir.absolutePath
    // `-Dkatana.record=true` rewrites the fast loop's goldens too (sir/contract/COPYREC.contract).
    systemProperty 'katana.record', System.getProperty('katana.record', 'false')
    // The test classes run in parallel, four at once, each class's methods in turn (R-054 amended,
    // 2026-10-09): no two classes write the same file (`test/ParallelTest.java`).
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', '4'
    // The tests read the whole repository, not just their classes: never skip them as up to date.
    outputs.upToDateWhen { false }
    testLogging {
        events = ['failed', 'skipped']
        exceptionFormat = 'full'
    }
}

tasks.register('integration', Test) {
    description = 'The tests that need cobc and the fetched corpus (run in the image): NIST, later CardDemo.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    systemProperty 'katana.root', rootDir.absolutePath
    // `-Dkatana.record=true` rewrites the integration goldens from the run (their diff is the review).
    systemProperty 'katana.record', System.getProperty('katana.record', 'false')
    // `-Dkatana.std=ibm` runs one dialect of the NIST run only; by default both.
    systemProperty 'katana.std', System.getProperty('katana.std', 'cobol85,ibm')
    // `-Dkatana.nist.modules=NC,IF` runs those NIST modules only (the pre-push check's quick NIST).
    systemProperty 'katana.nist.modules', System.getProperty('katana.nist.modules', '')
    // Each test class in a JVM of its own, up to four at once: the suites write to folders of their own
    // under build/ (the pre-push check, tithe pass 2a).
    maxParallelForks = Math.min(4, Runtime.runtime.availableProcessors())
    forkEvery = 1
    // Within a class, methods run in turn, unless the class says `@Execution(CONCURRENT)`: the Java lane's
    // modules do, as its longest path held the pre-push check past its ceiling (R-054, J-181).
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'fixed'
    systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', '4'
    outputs.upToDateWhen { false }
    testLogging {
        events = ['passed', 'failed', 'skipped']
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

// R-056: a test task that ran zero tests is red (J-006: the doc tests once ran none and passed).
tasks.withType(Test).configureEach { task ->
    task.afterSuite { desc, result ->
        if (desc.parent == null && result.testCount == 0) throw new GradleException("${task.name} ran no tests: a zero-run is red (R-056, J-006)")
    }
}
