// Katana's build: Java 21, offline, every dependency a file under third_party/ (R-001).
// No repository is declared, so nothing can reach the network; a new dependency is vendored first.
plugins {
    id 'java'
}

// The image pins Gradle (Dockerfile); a different Gradle outside it is refused, not tolerated.
if (gradle.gradleVersion != '8.14.3') {
    throw new GradleException("Katana builds with Gradle 8.14.3 (the Dockerfile's image); this is ${gradle.gradleVersion}")
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Katana's modules are the folders docs/modules.json names (the list lives only there); the study's
// prototypes inside them are not part of the build.
def modules = new groovy.json.JsonSlurper().parse(file('docs/modules.json')).modules.keySet()

sourceSets {
    main {
        java {
            srcDirs = modules.collect { it }
            exclude '**/prototypes/**'
        }
    }
    // The project's own tooling (phase 0.6): the kernel map and the metrics. Never shipped.
    scripts {
        java.srcDirs = ['scripts']
    }
    // The doc tests and the scripts' tests (default package), and each module's tests (its package).
    test {
        java.srcDirs = ['test']
        compileClasspath += scripts.output
        runtimeClasspath += scripts.output
    }
}

dependencies {
    scriptsImplementation files('third_party/gson/gson-2.11.0.jar')
    testImplementation files('third_party/gson/gson-2.11.0.jar')
    testImplementation fileTree(dir: 'third_party/junit', include: '*.jar')
}

tasks.register('metrics', JavaExec) {
    description = 'Prints the metrics of docs/AGENT.md and the warnings of docs/ROADMAP.md 4.2.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'Metrics'
    systemProperty 'katana.root', rootDir.absolutePath
}

tasks.register('kernelMap', JavaExec) {
    description = 'Appends to docs/KERNEL-MAP.md a row for every function in a module it does not hold.'
    classpath = sourceSets.scripts.runtimeClasspath
    mainClass = 'KernelMap'
    systemProperty 'katana.root', rootDir.absolutePath
}

tasks.named('test') {
    useJUnitPlatform()
    // The doc tests read the repository; they run from its root wherever Gradle is started.
    systemProperty 'katana.root', rootDir.absolutePath
    // The tests read the whole repository, not just their classes: never skip them as up to date.
    outputs.upToDateWhen { false }
    testLogging {
        events = ['failed', 'skipped']
        exceptionFormat = 'full'
    }
}
