# The fast loop on every push and pull request, in the pinned image with the network off
# (docs/ROADMAP.md 0.3): what passes here is what a clean clone builds offline.
name: ci
on:
  push:
  pull_request:
jobs:
  fast-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t katana .
      - name: Build and test, network off
        run: docker run --rm --network none -u "$(id -u)" -v "$PWD":/katana katana gradle build --offline --warning-mode fail

  # NIST through the cobc lane (docs/ROADMAP.md 1.1, 1.2): the source fetched (network on), then one
  # run per dialect in the image with the network off, each held to its golden (oracle/nist/
  # programs.golden, programs-ibm.golden); the reconciliation with the published summary and the
  # record of what the IBM dialect changes are in the fast loop. Each run step must finish in 3
  # minutes, as 1.1 requires.
  nist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t katana .
      - name: Fetch the NIST source (pinned, hash-checked)
        run: sh corpus/fetch.sh nist-cobol85-test-suite
      - name: Run NIST under cobc -std=cobol85, network off
        timeout-minutes: 3
        run: docker run --rm --network none -u "$(id -u)" -v "$PWD":/katana katana gradle integration --offline --warning-mode fail -Dkatana.std=cobol85
      - name: Run NIST under cobc -std=ibm, network off
        timeout-minutes: 3
        run: docker run --rm --network none -u "$(id -u)" -v "$PWD":/katana katana gradle integration --offline --warning-mode fail -Dkatana.std=ibm
