# The fast loop in the pinned image with the network off (docs/ROADMAP.md 0.3): what passes here is
# what a clean clone builds offline. One run per change (R-050): on a push to main, where every step
# lands (R-040), and by hand; a branch push or a pull request runs nothing, since its commits are the
# ones main gets.
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
# The least a run needs (R-067): read the code; a job that needs more says so itself.
permissions:
  contents: read
jobs:
  fast-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # At a commit, its tag beside it: a tag can be moved, a commit cannot (R-067).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image
        run: docker build -t katana .
      - name: Build and test, network off
        run: docker run --rm --network none -u "$(id -u)" -v "$PWD":/katana katana gradle build --offline --warning-mode fail

  # NIST through the cobc lane (docs/ROADMAP.md 1.1, 1.2): the source fetched (network on), then one
  # run per dialect in the image with the network off, each held to its golden (oracle/nist/
  # programs.golden, programs-ibm.golden); the reconciliation with the published summary and the
  # record of what the IBM dialect changes are in the fast loop. Each run step must finish in 3
  # minutes, as 1.1 requires. Each NIST step also checks the CardDemo fixtures' sources (phase 1.3),
  # in well under a second; the CardDemo jobs through the cobc lane and the gate (phases 1.4 to 1.6)
  # and the comparator on the OMP data (1.7) are a step of their own.
  nist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # At a commit, its tag beside it: a tag can be moved, a commit cannot (R-067).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image
        run: docker build -t katana .
      - name: Fetch the NIST source, CardDemo and the OMP course (pinned; NIST hash-checked, the rest by their tests)
        run: sh corpus/fetch.sh nist-cobol85-test-suite carddemo omp-cobol-course
      - name: Run NIST under cobc -std=cobol85, network off
        timeout-minutes: 3
        run: docker run --rm --network none -u "$(id -u)" -v "$PWD":/katana katana gradle integration --offline --warning-mode fail -Dkatana.std=cobol85 --tests 'katana.oracle.nist.*' --tests 'katana.oracle.fixture.*'
      - name: Run NIST under cobc -std=ibm, network off
        timeout-minutes: 3
        run: docker run --rm --network none -u "$(id -u)" -v "$PWD":/katana katana gradle integration --offline --warning-mode fail -Dkatana.std=ibm --tests 'katana.oracle.nist.*' --tests 'katana.oracle.fixture.*'
      - name: Run CardDemo through the cobc lane and the gate, the comparator on OMP, the parser and the data map over the corpus, network off
        timeout-minutes: 8
        run: docker run --rm --network none -u "$(id -u)" -v "$PWD":/katana katana gradle integration --offline --warning-mode fail --tests 'katana.oracle.lane.*' --tests 'katana.oracle.compare.*' --tests 'katana.front.*' --tests 'katana.sir.*'
